# config.yaml

data:
  start_date: "2018-01-01"
  end_date: "2025-12-31"
  train_end_date: "2023-12-31"  # Train seti bitiş tarihi
  test_start_date: "2024-01-01" # Test seti başlangıç tarihi

strategy:
  initial_capital: 10000.0
  commission_rate: 0.001        # %0.1 Binance spot komisyonu
  slippage_rate: 0.0005         # %0.05 Kayma (slippage)
  position_size: 0.95           # Sermayenin %95'i ile tek pozisyon

genetic_algorithm:
  population_size: 100
  num_generations: 50
  crossover_rate: 0.8
  mutation_rate: 0.2
  tournament_size: 3
  elite_size: 5
  hof_size: 10